name: Python tools

on:
  push:
    branches: [main]
    paths: ["tools/esp_bridge/**", "tools/device_bridge/**", "tools/build_papp.py", "tools/make_catalog.py", "apps/**", "esphome/components/papp_loader/papp_data.h", "esphome/components/papp_loader/papp_canvas.h", "tools/make_listing.py", "tests/**", ".github/workflows/python-tools.yml"]
  pull_request:
    paths: ["tools/esp_bridge/**", "tools/device_bridge/**", "tools/build_papp.py", "tools/make_catalog.py", "apps/**", "esphome/components/papp_loader/papp_data.h", "esphome/components/papp_loader/papp_canvas.h", "tools/make_listing.py", "tests/**", ".github/workflows/python-tools.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v

      # The loader's data-list parser and SHA-256 are plain C++; test them on the host.
      - name: papp_data.h host tests
        run: |
          g++ -std=gnu++17 -Wall -Wextra -Werror -O2 -I esphome/components/papp_loader tests/cpp/test_papp_data.cpp -o "$RUNNER_TEMP/test_papp_data"
          "$RUNNER_TEMP/test_papp_data"

      # Canvas geometry (where an app's canvas and the close control go, sizes, per-app keys).
      - name: papp_canvas.h host tests
        run: |
          g++ -std=gnu++17 -Wall -Wextra -Werror -O2 -I esphome/components/papp_loader tests/cpp/test_papp_canvas.cpp -o "$RUNNER_TEMP/test_papp_canvas"
          "$RUNNER_TEMP/test_papp_canvas"

      # Download every pinned app data file and check its size and sha256, so a
      # bad pin fails here instead of in Publish store on main.
      - name: Verify pinned app data
        shell: python
        run: |
          import json, pathlib, sys, tempfile
          sys.path.insert(0, "tools")
          import build_papp, make_catalog
          for path in sorted(pathlib.Path("apps").glob("*/papp.json")):
              app = json.loads(path.read_text())
              data = build_papp.check_data(app["name"], app.get("data"))
              if data:
                  with tempfile.TemporaryDirectory() as tmp:
                      make_catalog.publish_data("o/r", {**app, "data": data}, pathlib.Path(tmp), None)
                  print(f"{app['name']}: {len(data['files'])} file(s) verified")
