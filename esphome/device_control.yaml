# Remote control for the PAPP loader over the ESPHome native API.
#
# Adds API actions that the ESP bridge (tools/esp_bridge), the helper in
# tools/papp_device.py, or Home
# Assistant can call:
#   papp_launch(url)       stream and start a .papp from a URL
#   papp_launch_rom(emulator, rom)
#                          select an emulator PAPP and a local game path
#                          under /sd or /usb0, then start it
#   papp_install_url(url, name, size, digest)
#                            verify and save a .papp under /sd/roms/papp
#   papp_upload_file(url, path, size, digest)
#                            verify and save any file under a path below /sd
#   papp_close()           close the running PAPP
#   papp_refresh_catalog() reload the store catalog
#   papp_screenshot()      send one 800x480 capture of the running PAPP to the
#                          diagnostic stream on TCP port 3233 (bridge `screenshot`)
#   papp_read_file(path)   send one SD card file under /sd/ (or a listing, for a
#                          path ending in /) to the same stream (bridge `readfile`)
#   papp_write_file(path, data)
#                          replace a small text file under /sd/ (.ini, .cfg, .txt,
#                          .json, ...), keeping the old one as .bak; refused while
#                          an app runs (bridge `writefile`)
#   papp_delete_file(path) remove one of those files, or a leftover .bak/.log,
#                          under /sd/; refused while an app runs (bridge `deletefile`)
#
# Include it from the device YAML (the device must already have `api:`; this
# package only adds actions to it). The long form with refresh: 0s picks up new
# actions at once; the short github:// form is re-downloaded only once a day.
#
#   packages:
#     papp_control:
#       url: https://github.com/NonaSuomy/esphomebrew
#       ref: main
#       files: [esphome/device_control.yaml]
#       refresh: 0s

substitutions:
  papp_loader_id: papp_runtime

api:
  actions:
    - action: papp_launch
      variables:
        url: string
      then:
        - papp_loader.launch_url:
            id: ${papp_loader_id}
            url: !lambda return url;
    - action: papp_launch_rom
      variables:
        emulator: string
        rom: string
      then:
        - papp_loader.launch_rom:
            id: ${papp_loader_id}
            emulator: !lambda return emulator;
            rom: !lambda return rom;
    - action: papp_install_url
      variables:
        url: string
        name: string
        size: int
        digest: string
      then:
        - lambda: |-
            id(${papp_loader_id})->request_install_url(url, name, static_cast<uint32_t>(size), digest);
    - action: papp_upload_file
      variables:
        url: string
        path: string
        size: int
        digest: string
      then:
        - lambda: |-
            id(${papp_loader_id})->request_upload_url(url, path, static_cast<uint32_t>(size), digest);
    - action: papp_close
      then:
        - lambda: id(${papp_loader_id})->request_close();
    - action: papp_refresh_catalog
      then:
        - lambda: id(${papp_loader_id})->refresh_catalog();
    - action: papp_screenshot
      then:
        - lambda: id(${papp_loader_id})->request_screenshot();
    - action: papp_read_file
      variables:
        path: string
      then:
        - lambda: id(${papp_loader_id})->request_file(path);
    - action: papp_write_file
      variables:
        path: string
        data: string
      then:
        - lambda: id(${papp_loader_id})->write_file(path, data);
    - action: papp_delete_file
      variables:
        path: string
      then:
        - lambda: id(${papp_loader_id})->delete_file(path);
