# ESP bridge configuration. Copy to bridge.toml (keep it out of git) and edit.
# The bridge refuses anything not listed here.

[hub]
url = "https://ehgi.ai/api/mcp"
project_id = "3IDv1Ayo2F2gAuIzMSGL"          # PAPP Conversions
token_env = "EHGI_BRIDGE_TOKEN"              # env var holding the bridge agent's token
handle = "esp-bridge"                        # the bridge agent's handle in the project
allowed_requesters = ["claude", "nona", "franklin"]   # who may send jobs

[repo]
# Builds from a clean checkout of this repository at the requested ref.
url = "https://github.com/NonaSuomy/papp-conversions.git"
path = "~/code/papp-bridge/papp-conversions"
allowed_yaml = ["esphome/*.yaml"]
# Building a config runs code on this machine (external components and
# PlatformIO scripts from that ref), so allow only refs pushed by people with
# write access. Do NOT add "pull/*": anyone on GitHub can open a PR.
allowed_refs = ["main", "claude/*", "nona/*"]
# Private files copied into the checkout before every build (never committed).
[repo.extra_files]
"esphome/secrets.yaml" = "~/code/esphome006/config/secrets.yaml"

[local]
# Optional: build your existing config directory as-is with `source=local`.
# The team can request builds here but cannot change these files.
dir = "~/code/esphome006/config"
allowed_yaml = ["*.yaml"]

[esphome]
bin = "~/code/esphome006/venv/bin/esphome"
devices = ["/dev/ttyUSB0"]                   # add the device IP for OTA, e.g. "10.13.37.60"
timeout_config = 300
timeout_compile = 2400
timeout_upload = 900
max_log_seconds = 300
max_log_bytes = 1000000

[device_api]
# Launch/close PAPPs and refresh the store over the ESPHome native API. Needs
# esphome/device_control.yaml on the device and the bridge running with the
# ESPHome venv's python (it provides aioesphomeapi).
host = "10.13.37.60"                         # the P4's IP or hostname
port = 6053
screen_port = 3233                           # papp_loader diagnostic stream (screenshots, readfile); 3232 is ESPHome OTA
encryption_key_secret = "encryption_key016"  # name of the api key in secrets.yaml
# encryption_key_env = "ESP_API_KEY"         # or read it from an env var
allowed_url_prefixes = [
  "https://github.com/NonaSuomy/papp-conversions/releases/download/",
  "https://nonasuomy.github.io/papp-conversions/",
]
# Crash decoding for `launch/close ... serial=`: the panic dump's firmware
# addresses are looked up with addr2line in the firmware ELF whose SHA256
# matches the dump. By default the bridge looks in [local].dir/.esphome/build
# and the repo checkout, and finds addr2line in ~/.platformio or ~/.espressif.
# firmware_elf = ["~/code/esphome006/config/.esphome/build/*/.pioenvs/*/firmware.elf"]
# addr2line = "~/.platformio/packages/toolchain-riscv32-esp/bin/riscv32-esp-elf-addr2line"

[console]
# Print every request the bridge gets (who, which command) and its result in
# this terminal. Set to false to keep the terminal quiet.
show_requests = true

[actions]
# Start read-only; add "upload", "run", "logs" when you're happy with it.
enabled = ["status", "config", "compile", "upload", "logs", "run", "launch", "close", "catalog", "screenshot", "readfile",
           "writefile", "deletefile", "view", "edit"]
# Who may change local YAML with `edit`, or files on the device's SD card with
# `writefile`/`deletefile` (a subset of allowed_requesters). An edited config can pull in code that
# runs on this machine when compiled, so list only people and agents you trust with
# that. Empty or missing: nobody can edit.
edit_requesters = ["nona", "claude"]
