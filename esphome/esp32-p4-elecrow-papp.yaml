substitutions:
  device_name: esp32-p4-elecrow-papp
  friendly_name: "ESP32-P4 Elecrow PAPP Library"
  # PAPP catalogs: your LAN library and the GitHub store.
  papp_lan_url: "http://10.20.30.158:8000/"
  papp_store_url: "https://nonasuomy.github.io/esphomebrew-store/"

# Remote launch/close/refresh API actions for the ESP bridge and Home Assistant
# (papp_launch(url), papp_launch_rom(emulator, rom), papp_close,
# papp_refresh_catalog).
packages:
  # Use the checked-out package while testing the local component. Once the
  # change is published, this can be switched back to the GitHub package.
  - !include device_control.yaml

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  platformio_options:
    extra_scripts:
      - pre:/home/nonasuomy/code/esphome006/config/idf61_compat.py
    build_flags:
      # ESPHome's ADC component still refers to the pre-IDF-6.1 name.
      # ESP-IDF 6.1 exposes the equivalent 12 dB setting as ADC_ATTEN_DB_12.
      - -DADC_ATTEN_DB_11=ADC_ATTEN_DB_12
      - -DLV_USE_SNAPSHOT=1
      - -DLV_FONT_MONTSERRAT_28=1
      - -DLV_FONT_MONTSERRAT_16=1
      - -Wno-error
      - -Wno-error=format
      - -Wno-error=implicit-fallthrough
      - -Wno-error=missing-field-initializers
      - -Wno-error=old-style-definition
  on_boot:
    priority: -100
    then:
      - switch.turn_on: speaker_enable
      - lambda: |-
          ESP_LOGI("audio", "Elecrow NS4168 speaker enable: logical=%d (active-low GPIO6)",
                   id(speaker_enable).state ? 1 : 0);
      - lambda: |-
          id(papp_runtime)->set_catalog_container(id(papp_list));
          id(papp_runtime)->select_catalog("Storage");
          auto files = id(sd_card).list_directory("/", 0);
          ESP_LOGI("sdcard", "SD boot listing: %u entries", (unsigned) files.size());
          for (const auto &file : files)
            ESP_LOGI("sdcard", "  %s", file.c_str());

esp32:
  variant: esp32p4
  flash_size: 16MB
  engineering_sample: true
  framework:
    type: esp-idf
    # Match the full Elecrow build that previously had working game audio.
    version: 6.1.0
    # Reuse the complete local IDF 6.1 checkout without copying its large
    # submodule tree into PlatformIO's package cache.
    source: symlink:///home/nonasuomy/.cache/esphome/idf/frameworks/6.1.0
    # The USB-HID tester that is already working on this board uses the
    # develop branch; it also has the ESP-IDF 6.1 source-group fix needed for
    # ESP32-P4's duplicate-named eFuse sources.
    platform_version: https://github.com/pioarduino/platform-espressif32.git#develop
    advanced:
      enable_idf_experimental_features: true
      disable_vfs_support_dir: false
      include_builtin_idf_components:
        - fatfs
        - wear_levelling
        - esp_adc
    sdkconfig_options:
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_ESP32_SPIRAM_SUPPORT: "y"
      CONFIG_SPIRAM_USE_MALLOC: "y"
      CONFIG_SPIRAM_SPEED_200M: "y"
      CONFIG_SPIRAM_SPEED: "200"
      CONFIG_FATFS_LFN_HEAP: "y"
      CONFIG_FATFS_LFN_STACK: "y"
      CONFIG_VFS_SUPPORT_IO: "y"
      CONFIG_VFS_SUPPORT_DIR: "y"
      CONFIG_VFS_MAX_COUNT: "16"
      CONFIG_ESP_MAIN_TASK_STACK_SIZE: "16384"
      CONFIG_ESP_TIMER_TASK_STACK_SIZE: "4096"
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "60"
      CONFIG_ESP_TASK_LOOP_STACK_SIZE: "16384"
      CONFIG_LWIP_SOCKET: "y"
      CONFIG_LWIP_MAX_SOCKETS: "16"

safe_mode:
  disabled: true

psram:
  mode: hex
  speed: 200MHz

esp_ldo:
  - channel: 3
    voltage: 2.5V
  - channel: 4
    voltage: 2.5V

external_components:
  - source:
      type: local
      path: /home/nonasuomy/code/esphome006/config/components
    components: [lvgl, sd_mmc_card, usb_hidx, ethernet, i2s_audio, ledc, mipi_dsi, sha256]
  - source:
      type: git
      url: https://github.com/NonaSuomy/esphomebrew-store
      ref: main
    components: [define_fixup, usb_msc, usb_midi]
    refresh: 0s
  # Keep the app-grid layout fix in the checked-out latest source used here.
  - source:
      type: local
      path: /home/nonasuomy/code/papp-conversions/esphome/components
    components: [papp_loader]

define_fixup:

sd_mmc_card:
  id: sd_card
  clk_pin: GPIO43
  cmd_pin: GPIO44
  data0_pin: GPIO39
  mode_1bit: true
  slot: 1

usb_host:
  enable_hubs: true

# A USB stick (FAT32) mounts at /usb0 when plugged in; the loader looks for apps
# and game data there as well as on the SD card.
usb_msc:
  id: usb_storage

# A class-compliant USB-MIDI cable or keyboard (Textech 15ca:0101): its
# notes show in the log (VERBOSE) and, later, reach apps through the loader.
usb_midi:
  id: usb_midi_port

usb_hidx:
  id: usb_hidx_component
  hub: true
  # Keep the generic HID gamepad for ordinary USB controllers, and also
  # compile the dedicated Nintendo Switch Pro protocol driver.  The latter
  # is selected by VID:PID (057E:2009) at runtime.
  drivers:
    - switch
  keyboard:
    layout: us
  mouse: {}
  gamepad:
    device_id: gamepad_main
    type: generic

i2c:
  - id: bsp2_bus
    sda: GPIO18
    scl: GPIO19
    frequency: 400kHz

touchscreen:
  - platform: gt911
    id: touch_panel
    i2c_id: bsp2_bus
    address: 0x5D
    reset_pin: GPIO40
    interrupt_pin:
      number: GPIO41
      mode: INPUT
    transform:
      swap_xy: false
      mirror_x: false
      mirror_y: false
    calibration:
      x_min: 0
      x_max: 1024
      y_min: 0
      y_max: 600
    update_interval: 50ms

display:
  - platform: mipi_dsi
    id: main_display
    model: CUSTOM
    reset_pin:
      number: GPIO05
      inverted: false
    rotation: 180
    # The Elecrow panel is physically inverted.  Disable the MIPI MADCTL
    # transform so LVGL/PPA performs the rotation on the framebuffer; the
    # panel driver otherwise consumes this value and LVGL sees rotation 0.
    transform: disabled
    auto_clear_enabled: false
    lanes: 2
    lane_bit_rate: 1000Mbps
    color_order: rgb
    pclk_frequency: 51MHz
    dimensions:
      width: 1024
      height: 600
    hsync_back_porch: 160
    hsync_pulse_width: 70
    hsync_front_porch: 160
    vsync_back_porch: 23
    vsync_pulse_width: 10
    vsync_front_porch: 12
    init_sequence:
      - [0xB2, 0x10]
      - [0x80, 0x8B]
      - [0x81, 0x78]
      - [0x82, 0x84]
      - [0x83, 0x88]
      - [0x84, 0xA8]
      - [0x85, 0xE3]
      - [0x86, 0x88]
      - [0x11]

output:
  - platform: ledc
    pin: GPIO20
    id: backlight_pwm
    frequency: 30000Hz

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: display_backlight
    restore_mode: ALWAYS_ON

# The Elecrow speakers are NS4168 I2S amplifiers behind an active-low
# P-MOS power gate.  Keep the logical switch ON while driving GPIO6 LOW.
switch:
  - platform: gpio
    pin:
      number: GPIO6
      inverted: true
    name: "Speaker Enable"
    id: speaker_enable
    restore_mode: ALWAYS_ON

i2s_audio:
  - id: i2s_output
    i2s_lrclk_pin: GPIO21
    i2s_bclk_pin: GPIO22

speaker:
  - platform: i2s_audio
    id: speaker_output
    i2s_audio_id: i2s_output
    dac_type: external
    i2s_dout_pin: GPIO23
    channel: stereo
    buffer_duration: 100ms
    timeout: 5s
    bits_per_sample: 16bit
    sample_rate: 48000
  # PAPP audio is generated at 22.05 kHz. Keep the proven full-build audio
  # path so the stream is resampled before it reaches the 48 kHz I2S DMA.
  - platform: mixer
    id: mixing_speaker
    output_speaker: speaker_output
    num_channels: 2
    task_stack_in_psram: true
    source_speakers:
      - id: announcement_mixing_input
      - id: media_mixing_input
  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
    sample_rate: 48000
    bits_per_sample: 16
  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input
    sample_rate: 48000
    bits_per_sample: 16

number:
  - platform: template
    name: "PAPP Master Volume"
    id: papp_master_volume
    min_value: 0
    max_value: 100
    step: 5
    initial_value: 70
    restore_value: true
    optimistic: true
    on_value:
      - lambda: id(papp_runtime)->set_master_volume(static_cast<int32_t>(x));

text_sensor:
  - platform: usb_hidx
    type: keyboard
    id: papp_keyboard
    internal: true

binary_sensor:
  # Held keyboard keys: the PAPP loader maps these to gamepad buttons for apps
  # (arrows/WASD move, Space/Enter/Z = A, X = B, C = X, V/Tab = Y, Q/E = L/R,
  # Escape = Menu, Enter = Start, Backspace = Select).
  - platform: usb_hidx
    type: keyboard
    id: papp_key_up
    key: 0x52
    internal: true
  - platform: usb_hidx
    type: keyboard
    id: papp_key_down
    key: 0x51
    internal: true
  - platform: usb_hidx
    type: keyboard
    id: papp_key_left
    key: 0x50
    internal: true
  - platform: usb_hidx
    type: keyboard
    id: papp_key_right
    key: 0x4F
    internal: true
  - platform: usb_hidx
    type: keyboard
    id: papp_key_w
    key: 0x1A
    internal: true
  - platform: usb_hidx
    type: keyboard
    id: papp_key_a
    key: 0x04
    internal: true
  - platform: usb_hidx
    type: keyboard
    id: papp_key_s
    key: 0x16
    internal: true
  - platform: usb_hidx
    type: keyboard
    id: papp_key_d
    key: 0x07
    internal: true
  - platform: usb_hidx
    type: keyboard
    id: papp_key_space
    key: 0x2C
    internal: true
  - platform: usb_hidx
    type: keyboard
    id: papp_key_enter
    key: 0x28
    internal: true
  - platform: usb_hidx
    type: keyboard
    id: papp_key_z
    key: 0x1D
    internal: true
  - platform: usb_hidx
    type: keyboard
    id: papp_key_x
    key: 0x1B
    internal: true
  - platform: usb_hidx
    type: keyboard
    id: papp_key_c
    key: 0x06
    internal: true
  - platform: usb_hidx
    type: keyboard
    id: papp_key_v
    key: 0x19
    internal: true
  - platform: usb_hidx
    type: keyboard
    id: papp_key_tab
    key: 0x2B
    internal: true
  - platform: usb_hidx
    type: keyboard
    id: papp_key_q
    key: 0x14
    internal: true
  - platform: usb_hidx
    type: keyboard
    id: papp_key_e
    key: 0x08
    internal: true
  - platform: usb_hidx
    type: keyboard
    id: papp_key_escape
    key: 0x29
    internal: true
  - platform: usb_hidx
    type: keyboard
    id: papp_key_backspace
    key: 0x2A
    internal: true
  - platform: usb_hidx
    type: mouse
    id: papp_mouse_left
    left_button: true
    internal: true
  - platform: usb_hidx
    type: mouse
    id: papp_mouse_right
    right_button: true
    internal: true
  - platform: usb_hidx
    type: gamepad
    name: "PAPP D-Pad Up"
    id: papp_dpad_up
    internal: true
    dpad_up: true
  - platform: usb_hidx
    type: gamepad
    name: "PAPP D-Pad Down"
    id: papp_dpad_down
    internal: true
    dpad_down: true
  - platform: usb_hidx
    type: gamepad
    name: "PAPP D-Pad Left"
    id: papp_dpad_left
    internal: true
    dpad_left: true
  - platform: usb_hidx
    type: gamepad
    name: "PAPP D-Pad Right"
    id: papp_dpad_right
    internal: true
    dpad_right: true
  - platform: usb_hidx
    type: gamepad
    name: "PAPP A"
    id: papp_a
    internal: true
    button_a: true
  - platform: usb_hidx
    type: gamepad
    name: "PAPP B"
    id: papp_b
    internal: true
    button_b: true
  - platform: usb_hidx
    type: gamepad
    name: "PAPP X"
    id: papp_x
    internal: true
    button_x: true
  - platform: usb_hidx
    type: gamepad
    name: "PAPP Y"
    id: papp_y
    internal: true
    button_y: true
  - platform: usb_hidx
    type: gamepad
    name: "PAPP L"
    id: papp_l
    internal: true
    button_l: true
  - platform: usb_hidx
    type: gamepad
    name: "PAPP R"
    id: papp_r
    internal: true
    button_r: true
  - platform: usb_hidx
    type: gamepad
    name: "PAPP Select"
    id: papp_select
    internal: true
    button_minus: true
  - platform: usb_hidx
    type: gamepad
    name: "PAPP Start"
    id: papp_start
    internal: true
    button_plus: true
  - platform: usb_hidx
    type: gamepad
    name: "PAPP Right Trigger"
    id: papp_right_trigger
    internal: true
    button_zr: true
  - platform: gpio
    pin:
      number: GPIO2
      mode: INPUT_PULLUP
      inverted: false
    name: "PAPP Touch Button"
    id: papp_touch_button
    internal: true
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms

sensor:
  # Keep the axis reports registered so the selected USB driver can expose
  # analog input to PAPPs without bringing in any of the larger UI pages.
  - platform: usb_hidx
    type: gamepad
    axis: lx
    name: "PAPP Left Stick X"
    id: papp_lx
    internal: true
  - platform: usb_hidx
    type: gamepad
    axis: ly
    name: "PAPP Left Stick Y"
    id: papp_ly
    internal: true
  - platform: usb_hidx
    type: gamepad
    axis: rx
    name: "PAPP Right Stick X"
    id: papp_rx
    internal: true
  - platform: usb_hidx
    type: gamepad
    axis: ry
    name: "PAPP Right Stick Y"
    id: papp_ry
    internal: true
  - platform: usb_hidx
    type: mouse
    x_delta: true
    name: "PAPP Mouse X"
    id: papp_mouse_x
    internal: true
  - platform: usb_hidx
    type: mouse
    y_delta: true
    name: "PAPP Mouse Y"
    id: papp_mouse_y
    internal: true
  # Elecrow GPIO16 resistor-ladder buttons. The PAPP loader consumes this
  # value for both in-app input and PAPP-library navigation.
  - platform: adc
    pin: GPIO16
    name: "PAPP ADC Buttons"
    id: papp_adc_buttons
    internal: true
    update_interval: 50ms
    attenuation: 12db
    filters:
      - median:
          window_size: 5
          send_every: 1

papp_loader:
  id: papp_runtime
  display_id: main_display
  touchscreen_id: touch_panel
  speaker_id: media_resampling_speaker
  lvgl_id: lvgl_component
  usb_hidx_id: usb_hidx_component
  usb_midi_id: usb_midi_port
  path: /sd/roms/papp/doom.papp
  catalogs:
    - name: Storage
      url: /sd/roms/papp/
      actions:
        - label: Mount
          then:
            - lambda: |-
                id(sd_card).mount();
                id(usb_storage).mount();
                auto files = id(sd_card).list_directory("/", 0);
                ESP_LOGI("sdcard", "Manual SD listing: %u entries", (unsigned) files.size());
                id(papp_runtime)->set_catalog_container(id(papp_list));
                id(papp_runtime)->select_catalog("Storage");
        - label: Eject storage
          then:
            - lambda: |-
                id(sd_card).unmount();
                id(usb_storage).unmount();
                id(papp_runtime)->set_catalog_container(id(papp_list));
                id(papp_runtime)->select_catalog("Storage");
    - name: Network
      url: "${papp_lan_url}"
    - name: Store
      url: "${papp_store_url}"
  default_catalog: Storage
  library_style: grid
  autostart: false
  button_up: papp_dpad_up
  button_down: papp_dpad_down
  button_left: papp_dpad_left
  button_right: papp_dpad_right
  button_select: papp_select
  button_start: papp_start
  button_a: papp_a
  button_b: papp_b
  button_x: papp_x
  button_y: papp_y
  button_l: papp_l
  button_r: papp_r
  fire_button: papp_right_trigger
  touch_button: papp_touch_button
  adc_button_sensor: papp_adc_buttons
  left_stick_x_sensor: papp_lx
  left_stick_y_sensor: papp_ly
  right_stick_x_sensor: papp_rx
  right_stick_y_sensor: papp_ry

logger:
  level: DEBUG
  hardware_uart: UART0

button:
  - platform: template
    name: "Remote Launch psram LVGL"
    id: remote_launch_psram_lvgl
    on_press:
      - lambda: id(papp_runtime)->request_launch("/sd/roms/papp/psram_lvgl.papp");
  - platform: template
    name: "Remote Launch NES"
    id: remote_launch_nes
    on_press:
      - lambda: id(papp_runtime)->request_launch("/sd/roms/papp/nes.papp");
  - platform: template
    name: "Remote Launch Template"
    id: remote_launch_template
    on_press:
      - lambda: id(papp_runtime)->request_launch("/sd/roms/papp/ESP32_P4_PAPP_Template.papp");
  - platform: template
    name: "Remote Launch Doom"
    id: remote_launch_doom
    on_press:
      - lambda: id(papp_runtime)->request_launch("/sd/roms/papp/doom.papp");
  - platform: template
    name: "Remote Launch Duke3D"
    id: remote_launch_duke3d
    on_press:
      - lambda: id(papp_runtime)->request_launch("/sd/roms/papp/duke3d.papp");
  - platform: template
    name: "Remote Launch OpenTyrian"
    id: remote_launch_opentyrian
    on_press:
      - lambda: id(papp_runtime)->request_launch("/sd/roms/papp/opentyrian.papp");
  - platform: template
    name: "Remote Launch Quake"
    id: remote_launch_quake
    on_press:
      - lambda: id(papp_runtime)->request_launch("/sd/roms/papp/quake.papp");
  - platform: template
    name: "Remote Launch Touchtest"
    id: remote_launch_touchtest
    on_press:
      - lambda: id(papp_runtime)->request_launch("/sd/roms/papp/touchtest.papp");
  - platform: template
    name: "Remote Close PAPP"
    id: remote_close_papp
    on_press:
      - lambda: id(papp_runtime)->request_close();
  - platform: template
    name: "Remote Enable Screen Stream"
    id: remote_enable_screen_stream
    on_press:
      - lambda: id(papp_runtime)->request_screen_stream();

text:
  - platform: template
    name: "Remote PAPP Path or URL"
    id: remote_papp_path
    mode: text
    optimistic: true
    on_value:
      - lambda: id(papp_runtime)->request_launch(x);
  - platform: template
    name: "Remote Emulator and ROM"
    id: remote_emulator_rom
    mode: text
    optimistic: true
    on_value:
      - lambda: |-
          const size_t separator = x.find('|');
          if (separator == std::string::npos) {
            ESP_LOGW("papp_loader", "Remote Emulator and ROM needs emulator|/sd/... or emulator|/usb0/...");
            return;
          }
          id(papp_runtime)->request_launch_rom(x.substr(0, separator), x.substr(separator + 1));

api:
  reboot_timeout: 0s

ota:
  - platform: esphome

script:
  # The loader has one catalog URL and one list at a time. Each page points it at
  # its own catalog and list; refresh_catalog() is ignored while a fetch is
  # already running, so refresh again shortly after to make the current page win.
  - id: papp_catalog_sync
    mode: restart
    then:
      - lambda: id(papp_runtime)->refresh_catalog();
      - delay: 4s
      - lambda: id(papp_runtime)->refresh_catalog();

ethernet:
  type: IP101
  mdc_pin: GPIO31
  mdio_pin: GPIO52
  power_pin: GPIO51
  clk:
    mode: CLK_EXT_IN
    pin: GPIO50
  phy_addr: 1

lvgl:
  id: lvgl_component
  # A touch or key must not wake LVGL behind a running PAPP: it would repaint
  # the launcher over the app (the loader pauses LVGL while an app runs).
  resume_on_input: false
  # PAPP already uses the display's software path on this panel because the
  # MIPI buffer is not PPA-aligned. Keep the same working rotation path and
  # avoid compiling the external PPA wrapper without its source subdirectory.
  use_ppa: false
  # A larger partial buffer gives scrolling enough rendering throughput on the
  # P4 panel while remaining comfortably inside PSRAM.
  buffer_size: 0.5
  # LVGL's default refresh interval is too slow for touch scrolling.
  update_interval: 16ms
  color_depth: 16
  byte_order: little_endian
  default_font: montserrat_20
  log_level: WARN
  pages:
    - id: papp_page
      width: 1024
      height: 600
      pad_all: 18
      scrollbar_mode: "OFF"
      bg_color: 0x08111F
      on_load:
        - lambda: |-
            id(papp_runtime)->select_catalog("Storage");
            id(papp_runtime)->set_catalog_container(id(papp_list));
            id(papp_runtime)->set_rom_selector_container(id(rom_game_list));
        - script.execute: papp_catalog_sync
      widgets:
        - label:
            text: "LIBRARY"
            align: TOP_LEFT
            text_color: 0x55D6FF
        - label:
            text: "ESPHOMEBREW"
            align: TOP_MID
            text_color: 0x55D6FF
        - list:
            id: papp_list
            x: 0
            # Nearly the whole page: the store grid gets five columns. The right
            # edge stays free for the side menu tab (Storage: Mount / Eject SD,
            # every source: Refresh).
            y: 42
            width: 950
            height: 530
            bg_color: 0x101F31
            border_width: 1
            border_color: 0x2D5875
            scrollbar_mode: AUTO
            scroll_momentum: true
            scroll_elastic: false
    - id: volume_page
      width: 1024
      height: 600
      pad_all: 18
      scrollbar_mode: "OFF"
      bg_color: 0x08111F
      on_load:
        - lvgl.slider.update:
            id: papp_volume_slider
            value: !lambda return static_cast<int>(id(papp_master_volume).state);
      widgets:
        - label:
            text: "VOLUME"
            align: TOP_LEFT
            text_color: 0x55D6FF
        - label:
            id: papp_volume_value
            text: "70%"
            align: TOP_MID
            text_color: 0xE2E8F0
        - slider:
            id: papp_volume_slider
            x: 120
            y: 170
            width: 780
            height: 48
            min_value: 0
            max_value: 100
            value: 70
            on_value:
              then:
                - number.set:
                    id: papp_master_volume
                    value: !lambda return x;
                - lvgl.label.update:
                    id: papp_volume_value
                    text:
                      format: "%.0f%%"
                      args: [x]
        - button:
            id: mute_volume
            width: 220
            height: 56
            x: 120
            y: 270
            widgets:
              - label:
                  text: "MUTE"
                  align: CENTER
            on_click:
              - number.set:
                  id: papp_master_volume
                  value: 0
              - lvgl.slider.update:
                  id: papp_volume_slider
                  value: 0
        - button:
            id: back_from_volume
            width: 220
            height: 56
            x: 680
            y: 270
            widgets:
              - label:
                  text: "BACK"
                  align: CENTER
            on_click:
              - lvgl.page.show: papp_page
    - id: rom_page
      width: 1024
      height: 600
      pad_all: 18
      scrollbar_mode: "OFF"
      bg_color: 0x08111F
      on_load:
        - lambda: |-
            id(papp_runtime)->set_rom_selector_container(id(rom_game_list));
            id(papp_runtime)->set_rom_selector_favorites_button(id(rom_favorites));
            id(papp_runtime)->refresh_rom_selector();
      widgets:
        - label:
            text: "SELECT GAME"
            align: TOP_LEFT
            text_color: 0x55D6FF
        - button:
            id: refresh_rom_games
            width: 150
            height: 40
            x: 650
            y: 0
            widgets:
              - label:
                  text: "REFRESH"
                  align: CENTER
            on_click:
              - lambda: id(papp_runtime)->refresh_rom_selector();
        - button:
            id: rom_favorites
            width: 170
            height: 40
            x: 255
            y: 0
            widgets:
              - label:
                  text: "FAVORITES"
                  align: CENTER
            on_click:
              - lambda: id(papp_runtime)->toggle_rom_favorites();
        - button:
            id: rom_mark_favorite
            width: 170
            height: 40
            x: 465
            y: 0
            widgets:
              - label:
                  text: "* GAME"
                  align: CENTER
            on_click:
              - lambda: id(papp_runtime)->toggle_selected_rom_favorite();
        - button:
            id: back_from_rom_games
            width: 170
            height: 40
            align: TOP_RIGHT
            widgets:
              - label:
                  text: "BACK"
                  align: CENTER
            on_click:
              - lvgl.page.show: papp_page
        - label:
            text: "A launches  * adds/removes a game favorite"
            x: 0
            y: 42
            text_color: 0xA0B8CC
        - list:
            id: rom_game_list
            x: 0
            y: 78
            width: 950
            height: 490
            bg_color: 0x101F31
            border_width: 1
            border_color: 0x2D5875
            scrollbar_mode: AUTO
    - id: papp_store_page
      width: 1024
      height: 600
      pad_all: 18
      scrollbar_mode: "OFF"
      bg_color: 0x08111F
      on_load:
        - lambda: |-
            id(papp_runtime)->select_catalog("Store");
            id(papp_runtime)->set_catalog_container(id(papp_store_list));
        - script.execute: papp_catalog_sync
      widgets:
        - label:
            text: "PAPP STORE"
            align: TOP_LEFT
            text_color: 0x55D6FF
        - label:
            text: "GITHUB"
            align: TOP_MID
            text_color: 0x55D6FF
        - label:
            text: "Store: nonasuomy.github.io/esphomebrew-store"
            x: 0
            y: 42
            text_color: 0xA0B8CC
        - list:
            id: papp_store_list
            x: 0
            y: 124
            # The loader owns the fixed source bar and right-hand slide-out
            # drawer; do not reserve a second static Store panel here.
            width: 950
            height: 404
            bg_color: 0x101F31
            border_width: 1
            border_color: 0x2D5875
            scrollbar_mode: AUTO
