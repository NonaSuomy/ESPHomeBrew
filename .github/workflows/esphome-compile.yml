name: ESPHome compile (P4)

on:
  push:
    branches: [main]
    paths: ["esphome/components/**", "esphome/tests/p4_loader_compile.yaml", ".github/workflows/esphome-compile.yml"]
  pull_request:
    paths: ["esphome/components/**", "esphome/tests/p4_loader_compile.yaml", ".github/workflows/esphome-compile.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache ESP-IDF and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.esphome
            esphome/tests/.esphome
          key: esphome-p4-2026.8.2-${{ hashFiles('esphome/components/**') }}
          restore-keys: esphome-p4-2026.8.2-
      - run: pip install esphome==2026.8.2
      # Builds the papp_loader C++ (including report_url) for the ESP32-P4.
      - run: esphome compile esphome/tests/p4_loader_compile.yaml
